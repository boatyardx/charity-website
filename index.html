<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown Landing Page</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #f0f0f0;
    color: #333;
  }

  .countdown-container {
    text-align: center;
    width: 90%;
    max-width: 600px;
  }

  h1 {
    font-size: 5vw; 
    margin: 0;
  }

  @media (min-width: 600px) {
    h1 {
      font-size: 3em;
    }
  }

  .message {
    font-size: 1.5em;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="countdown-container">
  <h1 id="countdown">Loading...</h1>
  <div class="message" id="message"></div>
</div>

<script>
  // Target date/time (December 18, 2024 20:00:00 Bucharest time (GMT+2))
  const targetDate = new Date('December 18, 2024 20:00:00 GMT+0200').getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
      document.getElementById('countdown').textContent = "00 zile, 00 ore, 00 minute, 00 secunde";
      document.getElementById('message').textContent = "Evenimentul a început!";
      clearInterval(timer);
      return;
    }

    // Calculate time components
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    // Format the output as "xx zile, yy ore, zz minute, tt secunde"
    const countdownString = 
      String(days).padStart(2, '0') + " zile, " +
      String(hours).padStart(2, '0') + " ore, " +
      String(minutes).padStart(2, '0') + " minute, " +
      String(seconds).padStart(2, '0') + " secunde";

    document.getElementById('countdown').textContent = countdownString;
  }

  // Update countdown every second
  const timer = setInterval(updateCountdown, 1000);
  updateCountdown();
</script>
</body>
</html>
